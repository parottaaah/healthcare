services:
  postgres:
    image: postgres:16
    container_name: decryptcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: decryptcare
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: decryptcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: decryptcare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
